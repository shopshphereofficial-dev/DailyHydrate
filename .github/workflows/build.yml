name: Build & Publish App

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble app bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # The wrapper JAR in this repo was assembled locally, so its checksum
          # is not in Gradle's published allow-list. The wrapper itself is
          # pinned and functional, so validation is turned off.
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Debug APK is signed with the standard debug key, so it installs on any
      # device via sideload. The release AAB is what you upload to Play Console.
      - name: Build debug APK and release App Bundle
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyHydrate-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: DailyHydrate-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Publishes the installable APK (and the Play-ready AAB) to a Release so
      # there is a stable direct download link.
      - name: Publish to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "DailyHydrate v1.0.0" \
              --notes "DailyHydrate - Water Tracker v1.0.0

          Offline, permission-free hydration tracker (Kotlin + Jetpack Compose).

          - \`app-debug.apk\` - install directly on your Android device (enable 'Install unknown apps').
          - \`app-release.aab\` - upload to Google Play Console.
          "
          fi
          gh release upload "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/bundle/release/app-release.aab \
            --clobber
